<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel da Modelo</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #07070b;
        color: #fff;
        height: 100vh;
        overflow: hidden; /* Evita que a página inteira Role */
      }
      .model-shell {
        display: grid;
        grid-template-columns: 1.35fr 0.95fr;
        gap: 20px;
        height: 100vh;
        padding: 24px;
      }
      .model-stage-card,
      .chat-card {
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      .model-stage-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      .model-stage__preview {
        position: relative;
        flex: 1;
        background: linear-gradient(135deg, #18181b, #2f0f2f);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }
      .model-stage__preview video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .model-stage__preview video.is-live {
        display: block;
      }
      .model-stage__placeholder {
        font-size: 20px;
        color: rgba(255, 255, 255, 0.74);
      }
      .model-stage__controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        background: rgba(0, 0, 0, 0.25);
        flex-shrink: 0; /* Garante que os controles do vídeo nunca encolham */
      }
      .model-stage__btn {
        border: none;
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
        background: #ff4d8d;
        color: white;
      }

      /* --- ESTRUTURA DO CHAT CORRIGIDA --- */
      .chat-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-height: 100%;
        min-height: 0; /* IMPEDIR QUE OS FILHOS EMPURREM A CAIXA */
      }
      .chat-card__header {
        padding: 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-weight: 700;
        flex-shrink: 0; /* O topo nunca encolhe ou some */
      }
      .chat-card__messages {
        flex: 1 1 0%; /* Ocupa exatamente o espaço que sobrar */
        min-height: 0; /* ESSENCIAL: força o flexbox a aceitar a rolagem interna */
        overflow-y: auto; /* Cria a barra de rolagem interna */
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-card__messages::-webkit-scrollbar {
        width: 6px;
      }
      .chat-card__messages::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .chat-card__messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
      }
      .chat-bubble {
        max-width: 88%;
        border-radius: 16px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.12);
        line-height: 1.4;
      }
      .chat-bubble__sender {
        margin-bottom: 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.75);
        font-weight: 700;
      }
      .chat-bubble__sender.user-name {
        background: transparent;
        padding: 0;
        border-radius: 0;
        display: inline-block;
      }
      .chat-bubble__text {
        white-space: pre-wrap;
        word-break: break-word;
        color: #fff;
      }
      .chat-bubble.user {
        align-self: flex-end;
        background: #ff4d8d;
      }
      .chat-bubble.assistant {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.14);
      }
      .chat-card__composer {
        display: flex;
        gap: 8px;
        padding: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        flex-shrink: 0; /* ESSENCIAL: Impede que o campo de enviar seja empurrado */
      }
      .chat-card__composer input {
        flex: 1;
        border: none;
        border-radius: 999px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        outline: none;
      }
      .chat-card__composer input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .chat-card__composer button {
        border: none;
        border-radius: 999px;
        padding: 0 16px;
        font-weight: 700;
        background: #ff4d8d;
        color: white;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
          height: auto;
        }
        .model-shell {
          grid-template-columns: 1fr;
          height: auto;
        }
        .chat-card {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="model-shell">
      <section class="model-stage-card">
        <div class="model-stage__preview">
          <video id="model-preview" autoplay playsinline muted></video>
          <div class="model-stage__placeholder" id="model-placeholder">
            Câmera da modelo desligada
          </div>
        </div>
        <div class="model-stage__controls">
          <strong>Transmitindo para a página inicial</strong>
          <button class="model-stage__btn" id="toggle-model-camera">
            Ligar câmera
          </button>
        </div>
      </section>

      <section class="chat-card">
        <div class="chat-card__header">Mensagens em tempo real</div>
        <div class="chat-card__messages" id="model-chat-messages"></div>
        <div class="chat-card__composer">
          <input id="model-chat-input" placeholder="Escreva para a live" />
          <button id="model-chat-send">Enviar</button>
        </div>
      </section>
    </div>

    <script>
      const modelPreview = document.getElementById("model-preview");
      const modelPlaceholder = document.getElementById("model-placeholder");
      const toggleBtn = document.getElementById("toggle-model-camera");
      const messagesBox = document.getElementById("model-chat-messages");
      const chatInput = document.getElementById("model-chat-input");
      const sendBtn = document.getElementById("model-chat-send");
      let cameraStream = null;
      let cameraOn = false;
      let streamTimer = null;
      let lastSendAt = 0;
      let lastFrameSent = null;
      const MAX_MODEL_MESSAGES = 60;
      const STREAM_FPS = 6;
      const STREAM_INTERVAL_MS = 1000 / STREAM_FPS;
      const STREAM_TARGET_WIDTH = 960;
      const STREAM_TARGET_HEIGHT = 540;
      const STREAM_QUALITY = 0.68;

      function createMessageBubble(msg) {
        const bubble = document.createElement("div");
        bubble.className = `chat-bubble ${msg.role === "user" ? "user" : "assistant"}`;

        const sender = document.createElement("div");
        sender.className = "chat-bubble__sender";
        sender.textContent =
          msg.role === "user" ? msg.viewerName || "Visitante" : "Modelo";
        if (msg.role === "user") {
          sender.classList.add("user-name");
          sender.style.color = msg.senderColor || "#4c9cff";
        }
        bubble.appendChild(sender);

        const content = document.createElement("div");
        content.className = "chat-bubble__text";
        content.textContent = msg.content;
        bubble.appendChild(content);

        return bubble;
      }

      function renderMessages(messages) {
        const visibleMessages = Array.isArray(messages)
          ? messages.slice(-MAX_MODEL_MESSAGES)
          : [];

        messagesBox.innerHTML = "";
        visibleMessages.forEach((msg) => {
          messagesBox.appendChild(createMessageBubble(msg));
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
        requestAnimationFrame(() => {
          messagesBox.scrollTop = messagesBox.scrollHeight;
          const last = messagesBox.lastElementChild;
          if (last) last.scrollIntoView({ block: "end" });
        });
      }

      async function refreshMessages() {
        try {
          const response = await fetch("/api/live-state");
          const data = await response.json();
          renderMessages(data.messages || []);
        } catch (error) {
          console.error(error);
        }
      }

      async function sendStreamFrame() {
        if (
          !cameraOn ||
          !modelPreview.videoWidth ||
          !modelPreview.videoHeight
        ) {
          return;
        }

        const now = Date.now();
        if (now - lastSendAt < STREAM_INTERVAL_MS) {
          return;
        }
        lastSendAt = now;

        const videoWidth = modelPreview.videoWidth || STREAM_TARGET_WIDTH;
        const videoHeight = modelPreview.videoHeight || STREAM_TARGET_HEIGHT;
        const scale = Math.min(
          1,
          Math.min(
            STREAM_TARGET_WIDTH / videoWidth,
            STREAM_TARGET_HEIGHT / videoHeight,
          ),
        );
        const width = Math.max(320, Math.round(videoWidth * scale));
        const height = Math.max(240, Math.round(videoHeight * scale));

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;

        ctx.drawImage(modelPreview, 0, 0, width, height);
        const frame = canvas.toDataURL("image/jpeg", STREAM_QUALITY);
        if (frame === lastFrameSent) {
          return;
        }
        lastFrameSent = frame;

        await fetch("/api/model/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: true, frame }),
        });
      }

      function startStreamTimer() {
        if (streamTimer) return;
        streamTimer = setInterval(() => {
          sendStreamFrame().catch(() => {});
        }, STREAM_INTERVAL_MS);
      }

      function stopStreamTimer() {
        if (streamTimer) {
          clearInterval(streamTimer);
          streamTimer = null;
        }
      }

      async function toggleCamera() {
        if (!cameraOn) {
          try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: "user",
                width: { ideal: STREAM_TARGET_WIDTH },
                height: { ideal: STREAM_TARGET_HEIGHT },
                frameRate: { ideal: STREAM_FPS, max: STREAM_FPS + 2 },
              },
              audio: false,
            });
            modelPreview.srcObject = cameraStream;
            modelPreview.classList.add("is-live");
            modelPreview.play().catch(() => {});
            modelPlaceholder.style.display = "none";
            toggleBtn.textContent = "Desligar câmera";
            cameraOn = true;
            startStreamTimer();
            await sendStreamFrame();
            window.dispatchEvent(
              new CustomEvent("model-camera-state", { detail: { on: true } }),
            );
          } catch (error) {
            alert("Não foi possível acessar a câmera da modelo.");
          }
        } else {
          stopStreamTimer();
          fetch("/api/model/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled: false }),
          }).catch(() => {});
          cameraStream?.getTracks().forEach((track) => track.stop());
          cameraStream = null;
          modelPreview.srcObject = null;
          modelPreview.classList.remove("is-live");
          modelPlaceholder.style.display = "flex";
          toggleBtn.textContent = "Ligar câmera";
          cameraOn = false;
          window.dispatchEvent(
            new CustomEvent("model-camera-state", { detail: { on: false } }),
          );
        }
      }

      async function sendModelMessage() {
        const content = chatInput.value.trim();
        if (!content) return;
        await fetch("/api/post-message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: "assistant", content }),
        });
        chatInput.value = "";
        refreshMessages();
      }

      toggleBtn.addEventListener("click", toggleCamera);
      sendBtn.addEventListener("click", sendModelMessage);
      chatInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          sendModelMessage();
        }
      });

      setInterval(refreshMessages, 1000);
      refreshMessages();
    </script>
  </body>
</html>
