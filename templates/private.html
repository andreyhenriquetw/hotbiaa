<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>Daniela Lima — Privado</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/post_payment.css') }}"
    />
  </head>
  <body class="private-page">
    <div class="live-screen">
      {% if video_url %}
      <video
        class="bg-video"
        autoplay
        muted
        loop
        playsinline
        {%
        if
        poster_url
        %}poster="{{ poster_url }}"
        {%
        endif
        %}
      >
        <source src="{{ video_url }}" type="video/mp4" />
      </video>
      {% endif %}

      <div class="ui-overlay">
        <!-- Topo Esquerda -->
        <header class="top-bar">
          <div class="top-bar-left">
            <span class="badge-online">ONLINE</span>
            <span class="badge-private">
              <svg
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              Privado
            </span>
            <button type="button" class="app-pill">
              <svg
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              App
            </button>
            <button type="button" class="icon-circle" aria-label="Visualizar">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </header>

        <!-- Elementos Flutuantes Direita -->
        <button
          class="private-camera-button"
          type="button"
          aria-label="Toque para ligar a câmera"
        >
          <div class="camera-icon-wrapper">
            <svg
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M23 7l-7 5 7 5V7z" />
              <rect x="1" y="5" width="15" height="14" rx="3" ry="3" />
            </svg>
          </div>
          <span>Toque para ligar a câmera</span>
        </button>

        <button
          class="private-whatsapp-float"
          type="button"
          aria-label="WhatsApp"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.764.459 3.486 1.333 5.001L2 22l5.132-1.346a9.932 9.932 0 004.88 1.28h.005c5.505 0 9.988-4.478 9.989-9.984 0-2.668-1.038-5.176-2.925-7.063C17.194 3.001 14.685 2 12.012 2zm0 1.802c2.186 0 4.241.852 5.786 2.397a8.13 8.13 0 012.398 5.788c-.001 4.512-3.673 8.185-8.185 8.185a8.127 8.127 0 01-4.168-1.148l-.3-.178-3.091.811.825-3.013-.195-.311a8.135 8.135 0 01-1.246-4.346c0-4.513 3.673-8.185 8.176-8.185zm4.72 10.976c-.259-.13-.1.532-1.53-.243-.376-.188-.65-.251-.926.162-.276.414-.11.532-1.353 1.066c-.244.133-.49.199-.766.066-.276-.133-1.165-.43-2.22-1.371-.82-.731-1.374-1.634-1.535-1.91-.161-.276-.017-.425.12-.561.123-.122.276-.322.414-.483.138-.161.184-.276.276-.46.092-.184.046-.345-.023-.483-.069-.138-.621-1.495-.851-2.047-.224-.538-.452-.465-.621-.474-.161-.009-.345-.009-.529-.009s-.483.069-.736.345c-.253.276-.966.943-.966 2.3 0 1.357 1.012 2.668 1.15 2.852.138.184 1.988 3.036 4.818 4.257.673.291 1.2.465 1.61.595.676.215 1.291.185 1.777.112.543-.081 1.667-.682 1.901-1.34.234-.658.234-1.222.164-1.34-.069-.118-.253-.187-.512-.317z"
            />
          </svg>
        </button>

        <!-- Área Central de Mensagens (Inferior) -->
        <div class="private-main">
          <main id="chat-area" class="chat-area">
            <div class="message assistant">
              <div class="bubble">
                <span class="sender-name">TALITA SANTOS 🔥</span>
                <span class="message-text"
                  >ai meu deus... finalmente você aqui no meu privado 🔥 tô toda
                  arrepiada te esperando safado...</span
                >
              </div>
            </div>
          </main>
        </div>

        <!-- Input de Texto Inferior Fixado -->
        <footer class="input-area">
          <div class="input-bar">
            <textarea
              id="user-input"
              rows="1"
              placeholder="Converse com a Talita Santos..."
              disabled
            ></textarea>
            <button
              id="send-btn"
              type="button"
              aria-label="Enviar mensagem"
              disabled
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
              </svg>
            </button>
          </div>
        </footer>
      </div>
    </div>

    <script>
      window.META_PIXEL_ID = '{{ config["META_PIXEL_ID"] }}';
      if (window.META_PIXEL_ID) {
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = "https://connect.facebook.net/en_US/fbevents.js";
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, "script");

        try {
          if (typeof fbq === "function") {
            fbq("init", window.META_PIXEL_ID);
            fbq("track", "PageView");
          }
        } catch (e) {
          // falha silenciosa
        }
      }
    </script>
    <script>
      (function () {
        const WHATSAPP_PLAN = "whatsapp-exclusivo";
        const WHATSAPP_AMOUNT = "13.99";
        const WHATSAPP_LINK = "https://wa.me/551199999999";

        const parsePaymentData = (data) => {
          return {
            pixCode:
              data.pix_code ||
              data.copy_paste ||
              data.pix ||
              data.qr_code_text ||
              data.code ||
              "",
            qrCode:
              data.qr_code ||
              data.qr_code_url ||
              data.pix_qr ||
              data.qr_code_text ||
              "",
            transactionId:
              data.transaction_id || data.transactionId || data.id || "",
            status: (data.status || "pending").toLowerCase(),
          };
        };

        const createWhatsappOverlay = () => {
          let overlay = document.getElementById("whatsapp-overlay");
          if (overlay) return overlay;

          overlay = document.createElement("div");
          overlay.id = "whatsapp-overlay";
          overlay.className = "whatsapp-overlay";
          overlay.innerHTML = `
            <div class="whatsapp-sheet" role="dialog" aria-modal="true">
              <div class="whatsapp-sheet-header">
                <div class="whatsapp-sheet-title">
                  <span class="whatsapp-badge">💬</span>
                  <div>
                    <strong class="whatsapp-title">WhatsApp Exclusivo</strong>
                    <p class="whatsapp-subtitle">Acesso por sessão</p>
                  </div>
                </div>
                <button type="button" class="whatsapp-close" aria-label="Fechar">×</button>
              </div>
              <div class="whatsapp-card">
                <div class="whatsapp-message-box">
                  <p>Me chama no WhatsApp! Bora uma chamada de vídeo!!</p>
                </div>
                <div class="whatsapp-price-row">
                  <span>Valor único</span>
                  <strong>R$ 13,99</strong>
                </div>
                <button type="button" class="whatsapp-action" id="whatsapp-pay-button">
                  Pagar e Acessar
                </button>
              </div>
            </div>
          `;

          overlay.addEventListener("click", (event) => {
            if (event.target === overlay) {
              hideWhatsappOverlay();
            }
          });

          document.body.appendChild(overlay);
          overlay
            .querySelector(".whatsapp-close")
            .addEventListener("click", hideWhatsappOverlay);
          overlay
            .querySelector("#whatsapp-pay-button")
            .addEventListener("click", showWhatsappPayment);

          return overlay;
        };

        const showWhatsappOverlay = () => {
          const overlay = createWhatsappOverlay();
          overlay.classList.add("visible");
          document.body.classList.add("whatsapp-active");
          document.body.style.overflow = "hidden";
        };

        const hideWhatsappOverlay = () => {
          const overlay = document.getElementById("whatsapp-overlay");
          if (!overlay) return;
          overlay.classList.remove("visible");
          document.body.classList.remove("whatsapp-active");
          document.body.style.overflow = "";
          clearInterval(window.whatsappPollTimer);
          window.whatsappPollTimer = null;
          setTimeout(() => {
            if (overlay.parentNode) {
              overlay.parentNode.removeChild(overlay);
            }
          }, 240);
        };

        const showWhatsappPayment = () => {
          const overlay = createWhatsappOverlay();
          const sheet = overlay.querySelector(".whatsapp-sheet");
          if (!sheet) return;

          sheet.innerHTML = `
            <div class="whatsapp-sheet-header">
              <div class="whatsapp-sheet-title">
                <span class="whatsapp-badge">💬</span>
                <div>
                  <strong class="whatsapp-title">WhatsApp Exclusivo</strong>
                  <p class="whatsapp-subtitle">R$ 13,99 via PIX</p>
                </div>
              </div>
              <button type="button" class="whatsapp-close" aria-label="Fechar">×</button>
            </div>
            <div class="whatsapp-card whatsapp-payment-card">
              <div class="whatsapp-loader-box">
                <div class="whatsapp-spinner"></div>
                <p>Gerando chave PIX...</p>
              </div>
            </div>
          `;

          sheet
            .querySelector(".whatsapp-close")
            .addEventListener("click", hideWhatsappOverlay);
          loadWhatsappPayment();
        };

        const loadWhatsappPayment = () => {
          const overlay = document.getElementById("whatsapp-overlay");
          if (!overlay) return;
          const card = overlay.querySelector(".whatsapp-payment-card");
          if (!card) return;

          fetch("/pushinpay/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              plan: WHATSAPP_PLAN,
              amount: WHATSAPP_AMOUNT,
            }),
          })
            .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
            .then(({ ok, body }) => {
              if (!ok || body.error) {
                throw new Error(body.error || "Erro ao criar checkout.");
              }
              const payment = parsePaymentData(body);
              if (!payment.transactionId) {
                throw new Error("Transação inválida.");
              }
              renderWhatsappPayment(card, payment);
              pollWhatsappPayment(payment.transactionId);
            })
            .catch((error) => {
              card.innerHTML = `<div class="whatsapp-error">${error.message}</div>`;
            });
        };

        const renderWhatsappPayment = (card, payment) => {
          const hasQr = Boolean(
            payment.qrCode && payment.qrCode.startsWith("data:"),
          );
          card.innerHTML = `
            <div class="whatsapp-payment-body">
              <div class="whatsapp-payment-summary">
                <div class="whatsapp-payment-note">Escaneie o QR Code ou copie a chave PIX abaixo.</div>
              </div>
              <div class="whatsapp-qr-frame">
                ${payment.qrCode ? `<img src="${payment.qrCode}" alt="QR Code PIX" />` : `<div class="whatsapp-qr-fallback">QR não disponível</div>`}
              </div>
              <div class="whatsapp-pix-copy">
                <div class="whatsapp-pix-label">PIX</div>
                <div class="whatsapp-pix-code">${payment.pixCode || "-"}</div>
                <button type="button" class="whatsapp-copy-button" id="whatsapp-copy-button">Copiar Código PIX</button>
              </div>
              <div class="whatsapp-status-row">
                <span class="whatsapp-status-label">Status</span>
                <span class="whatsapp-status-text" id="whatsapp-status-text">Aguardando pagamento...</span>
              </div>
              <button type="button" class="whatsapp-action whatsapp-access-button" id="whatsapp-access-button" disabled>
                Aguardar pagamento para liberar WhatsApp
              </button>
            </div>
          `;

          const copyButton = card.querySelector("#whatsapp-copy-button");
          if (copyButton) {
            copyButton.addEventListener("click", () => {
              if (!payment.pixCode) return;
              navigator.clipboard.writeText(payment.pixCode);
              copyButton.textContent = "CÓDIGO COPIADO!";
              copyButton.classList.add("copied");
              setTimeout(() => {
                copyButton.textContent = "Copiar Código PIX";
                copyButton.classList.remove("copied");
              }, 2500);
            });
          }

          const accessButton = card.querySelector("#whatsapp-access-button");
          if (accessButton) {
            accessButton.addEventListener("click", () => {
              if (accessButton.dataset.paid !== "true") return;
              window.location.href = WHATSAPP_LINK;
            });
          }
        };

        const pollWhatsappPayment = (transactionId) => {
          const statusElement = document.getElementById("whatsapp-status-text");
          const accessButton = document.getElementById(
            "whatsapp-access-button",
          );
          if (!statusElement || !accessButton) return;

          if (window.whatsappPollTimer) {
            clearInterval(window.whatsappPollTimer);
          }

          window.whatsappPollTimer = setInterval(() => {
            fetch(
              `/pushinpay/status?transaction_id=${encodeURIComponent(transactionId)}`,
            )
              .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
              .then(({ ok, body }) => {
                if (!ok || body.error) {
                  statusElement.textContent = "Erro ao verificar pagamento";
                  statusElement.style.color = "#ff8b8b";
                  return;
                }
                const status = (body.status || "pending").toLowerCase();
                if (
                  [
                    "paid",
                    "pago",
                    "confirmed",
                    "approved",
                    "completed",
                  ].includes(status)
                ) {
                  statusElement.textContent = "Pagamento confirmado!";
                  statusElement.style.color = "#7df0a5";
                  accessButton.disabled = false;
                  accessButton.dataset.paid = "true";
                  accessButton.textContent = "Entrar no WhatsApp";
                  accessButton.classList.add("whatsapp-access-ready");
                  clearInterval(window.whatsappPollTimer);
                  window.whatsappPollTimer = null;
                } else if (
                  ["expired", "cancelled", "canceled"].includes(status)
                ) {
                  statusElement.textContent = "Pagamento expirado";
                  statusElement.style.color = "#ff8b8b";
                  accessButton.disabled = true;
                } else {
                  statusElement.textContent = "Aguardando pagamento...";
                  statusElement.style.color = "#f5f5f5";
                }
              })
              .catch(() => {
                statusElement.textContent = "Erro de conexão";
                statusElement.style.color = "#ff8b8b";
              });
          }, 4000);
        };

        document.addEventListener("DOMContentLoaded", () => {
          const button = document.querySelector(".private-whatsapp-float");
          if (!button) return;
          button.addEventListener("click", showWhatsappOverlay);
        });
      })();
    </script>
  </body>
</html>
